<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Project X-Core | 蒼藍核心</title>
  <link rel="preload" as="font" type="font/woff2" href="./fonts/fusion-pixel-12px-proportional-latin.otf.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="./fonts/fusion-pixel-12px-proportional-zh_hk.otf.woff2" crossorigin />
  <style>
    @font-face {
      font-family: "Fusion Pixel";
      src: url("./fonts/fusion-pixel-12px-proportional-latin.otf.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Fusion Pixel";
      src: url("./fonts/fusion-pixel-12px-proportional-zh_hk.otf.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
      unicode-range: U+2E80-2FFF, U+3000-303F, U+3100-312F, U+31C0-31EF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE10-FE1F, U+FE30-FE4F, U+FF00-FFEF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #2a1218;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body { display: flex; justify-content: center; align-items: center; font-family: "Fusion Pixel", sans-serif; }
    #game-container { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 32px rgba(180, 70, 40, 0.28); }
    .font-warmup {
      position: absolute;
      left: -9999px;
      top: 0;
      font-family: "Fusion Pixel";
      font-size: 12px;
      pointer-events: none;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="font-warmup" aria-hidden="true">Project X-Core 蒼藍核心 學習站 科學分 聲動齊心合力</div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
